<title>Review Rounds</title>

<style>
/* Layout: Kelvin App Workspace preset. Grey canvas, a left nav of pages, white panels: the intro, a sticky progress panel, one panel per site. */

.filters button:hover { color: var(--text); }
.filters button[aria-pressed="true"] { background: var(--bg); color: var(--text); box-shadow: 0 0 0 1px var(--border-subtle); }
/* The tracker anchors to the bottom of the nav, above a hairline. */
/* Rules sit at the bottom of the nav as a compact Steps card. */
.nav-rules { margin-top: auto; padding-top: var(--space-2); border-top: 1px solid var(--border-subtle); }
.nav-rules .nav-label { padding-top: var(--space-2); }
/* The key reads like the rules: a label, then rows with the sample in the number column. */
.steps.key .step-num { width: auto; min-width: 52px; }
.steps.key del, .steps.key ins { padding: 0 3px; border-radius: 3px; color: var(--text); font-size: 12px; }

.nav-legend { display: flex; flex-wrap: wrap; gap: 4px var(--space-4); padding: var(--space-2) var(--space-2) var(--space-1); font-size: 13px; line-height: 18px; color: var(--text-secondary); }
.nav-legend del, .nav-legend ins { padding: 0 3px; border-radius: 3px; color: var(--text); }

.b-round { color: var(--text); font-weight: 600; }

.nav-pages { display: flex; flex-direction: column; gap: 2px; padding-bottom: var(--space-4); }

.page { margin-top: var(--space-6); scroll-margin-top: var(--space-3); }

.tag.facts { }

.left { display: flex; flex-direction: column; gap: var(--space-3); min-width: 0; }

textarea { width: 100%; box-sizing: border-box; font: 450 15px/22px var(--font-sans); color: var(--text); background: var(--bg); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: var(--space-2) var(--space-3); min-height: 64px; resize: none; overflow: hidden; background: var(--bg-input); }

  .wrap { grid-template-columns: 1fr; min-height: 0; } .nav { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--border-subtle); flex-direction: row; flex-wrap: wrap; padding-left: max(16px, env(safe-area-inset-left, 0px)); } .nav-label, .nav-pages, .nav-rules { width: 100%; } .main { padding-left: max(var(--space-3), env(safe-area-inset-left, 0px)); } .panel { padding: var(--space-4); } .bleed-rule::before { left: calc(-1 * var(--space-4)); right: calc(-1 * var(--space-4)); } }

/* Tree and detail, like the design system viewer's Files view: sites, pages, items and their rounds on the left, the selected one on the right. */
.browser { padding: 0; }
.browser-body { display: grid; grid-template-columns: var(--list-width) minmax(0, 1fr); align-items: start; }
/* The divider lives on a full-height column so it runs the whole way down, while the list inside it stays sticky. */
.tree-col { align-self: stretch; background: var(--bg-row); border-right: 1px solid var(--border-subtle); min-width: 0; }
.tree { position: sticky; top: var(--space-3); max-height: calc(100vh - var(--space-6)); overflow-y: auto; }
.t-row { display: flex; align-items: center; gap: var(--space-2); padding: 0 var(--space-3); cursor: pointer; scroll-margin-top: var(--space-3); }
.t-row:hover { background: var(--bg-muted); }
.t-row[aria-selected="true"] { background: var(--bg-selected); }
.t-row:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
.t-twist { width: 16px; height: 16px; flex: none; display: inline-flex; align-items: center; justify-content: center; border: 0; padding: 0; background: none; color: inherit; cursor: pointer; }
.t-twist svg.lucide { width: 14px; height: 14px; color: var(--text-secondary); transition: transform .15s ease-out; }

.t-text { min-width: 0; display: flex; flex-direction: column; flex: 1; }
.t-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.t-meta { font-size: 12px; line-height: 16px; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* Packed rows, every one closed by a hairline: a site is a quiet band, a page a bold row, an item a plain row. */
.t-row { border-bottom: 1px solid var(--border-subtle); }
.t-row.site { min-height: 32px; font-size: 13px; line-height: 18px; color: var(--text-secondary); background: var(--bg-sidebar); cursor: default; }
.t-row.site:hover { background: var(--bg-sidebar); }
.t-row.page { margin-top: 0; min-height: 36px; font-size: 14px; line-height: 20px; font-weight: 600; }
.t-row.page .t-count { margin-left: auto; font-weight: 400; font-size: 13px; color: var(--text-secondary); }
.t-row.item { min-height: 36px; font-size: 14px; line-height: 18px; }
.t-row.round { min-height: 28px; font-size: 13px; line-height: 18px; color: var(--text-secondary); }
.t-row.round[aria-selected="true"] { color: var(--text); }
.t-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }

.t-row.item .t-dot { margin: 0 4px; }
.t-dot.approve { background: var(--success); } .t-dot.reject { background: var(--danger); } .t-dot.keep { background: var(--text-secondary); }
.t-dot.open { box-shadow: inset 0 0 0 1.5px var(--text-secondary); } .t-dot.none { box-shadow: inset 0 0 0 1.5px var(--border-strong); }
.layout-tabs { display: inline-flex; gap: 2px; padding: 2px; border-radius: var(--radius-md); background: var(--bg-muted); }
.layout-tabs button { height: 26px; padding: 0 var(--space-3); border: 0; border-radius: var(--radius-sm); background: none; color: var(--text-secondary); font: 450 14px/20px var(--font-sans); cursor: pointer; }
.layout-tabs button[aria-pressed="true"] { background: var(--bg); color: var(--text); box-shadow: 0 0 0 1px var(--border-subtle); }
/* Full width: no canvas, no cards. Sections run to the pane's edges and are split by hairlines only. */
body.flat { background: var(--bg-panel); }
body.flat .main { padding: 0; gap: 0; min-height: 100vh; }
/* The review fills the rest of the pane, so the list's divider reaches the bottom even when there's little in it. */
body.flat .browser { flex: 1 1 auto; display: flex; flex-direction: column; }
body.flat .browser-body { flex: 1 1 auto; }
body.flat .panel { border: 0; border-radius: 0; border-bottom: 1px solid var(--border-subtle); background: var(--bg-panel); }
body.flat header.panel { padding: var(--space-4) var(--space-6); }
/* A short intro: one eyebrow, a modest title, one line of instructions. */

header.intro h1 { font-size: 24px; line-height: 32px; margin: 0; }
header.intro p { margin: 0; }
body.flat .browser { border-bottom: 0; }
/* The header starts in the same column as the chevrons and dots below it. */
body.flat .tree { top: var(--bar-h); max-height: calc(100vh - var(--bar-h)); }
.detail { padding: var(--space-6); min-width: 0; container-type: inline-size; }
.detail .item { padding-block: 0; }
.d-title { font: 400 28px/36px var(--font-serif); margin: 0; text-wrap: balance; }
.d-rounds { display: flex; gap: var(--space-2); flex-wrap: wrap; }

function emptyState() {

    "Claude opens a round with the changes it proposes and why.",
    "You approve each one, ask for changes, or keep what's there, and comment on any of them.",

function tree(M, roundItems) {

}

// The right side: the selected change in full. The newest round takes a decision; earlier rounds show what was decided.
function detail(M) {

    ...[].concat(it.rules || []).map((r) => { const rule = S.rules.get(str(r)) || {}; return el("span", { class: "rule-num", title: str(rule.text) || null, text: str(rule.label) || str(r) }); }),

  }
  // A space kept between two changed words reads as part of the change, so the highlight doesn't break up.
  const bridge = (T, m) => T.forEach((t, k) => { if (/^\s+$/.test(t) && !m[k] && m[k - 1] && m[k + 1]) m[k] = true; });
  bridge(A, ma); bridge(B, mb);
  const runs = (T, m) => T.reduce((out, t, k) => {
    const last = out[out.length - 1];
    if (last && last[1] === m[k]) last[0] += t; else out.push([t, m[k]]);
    return out;
  }, []);
  return [runs(A, ma), runs(B, mb)];
}
function paint(parts, tag) { return parts.map(([t, changed]) => changed && t.trim() ? el(tag, { text: t }) : document.createTextNode(t)); }

function setStatus(id, status, saved) {
  S.decisions[id] = { ...(S.decisions[id] || {}), status };
  save(id, { status }, saved);
  render();
}
async function save(id, patch, saved) {
  S.decisions[id] = { ...(S.decisions[id] || {}), ...patch };
  counts(model());
  if (!db) { saved.textContent = "not saved"; return; }
  const s = S.decisions[id];
  try {
    await db.collection("decisions").doc(id).set({ status: str(s.status), comment: str(s.comment), round: +(S.items.get(id)?.round) || null, at: new Date().toISOString() });
    saved.textContent = "saved";
  } catch (e) { saved.textContent = e?.code === "permission_denied" || e?.code === "not_granted" ? "you can view this review but not decide on it" : "couldn't save, try again"; }
}

function counts(M) {
  if (selRound == null) return;
  const v = inRound(M, selRound).map((i) => S.decisions[i.id] || {});
  const total = v.length || 1;
  const yes = v.filter((s) => s.status === "approve").length, no = v.filter((s) => s.status === "reject").length, keep = v.filter((s) => s.status === "keep").length;
  document.getElementById("p-done").textContent = yes + no + keep;
  document.getElementById("p-total").textContent = v.length;
  document.getElementById("t-yes").style.width = (yes / total) * 100 + "%";
  document.getElementById("t-no").style.width = (no / total) * 100 + "%";
  document.getElementById("t-keep").style.width = (keep / total) * 100 + "%";
  const bar = document.getElementById("progress");
  bar.setAttribute("aria-valuemax", v.length); bar.setAttribute("aria-valuenow", yes + no + keep);
}

// Left nav: the review's name, then one row per round, newest first, with what's still open in it.
function nav(M) {
  const box = document.getElementById("nav");
  box.textContent = "";
  box.append(el("div", { class: "nav-title", text: str(S.meta.title) || "Review" }));
  if (!M.rounds.length) return;
  box.append(el("div", { class: "nav-label" }, [el("span", { text: "Rounds" })]));
  for (const n of [...M.rounds].reverse()) {
    const open = inRound(M, n).filter((i) => !verdictOf(i.id)).length;
    const a = el("a", { href: "#", "aria-current": String(n === selRound) }, [el("span", { text: "Round " + n }), open ? el("span", { class: "open", text: String(open) }) : null]);
    a.onclick = (e) => { e.preventDefault(); pickRound(n); };
    box.append(a);
  }
}
function drawRules() {
  const rules = [...S.rules.values()].sort((a, b) => ((a.order ?? 1e9) - (b.order ?? 1e9)) || a.id.localeCompare(b.id, undefined, { numeric: true }));
  document.getElementById("nav-rules").hidden = !rules.length;
  document.getElementById("rules").replaceChildren(...rules.map((r) => el("li", {}, [
    el("span", { class: "step-num", text: str(r.label) || r.id }), el("span", { text: str(r.text) })])));
}

// Layout: Kelvin App Workspace, full width. Sections run to the pane's edges, split by hairlines only.
document.body.classList.add("flat");
try { new ResizeObserver(([e]) => document.documentElement.style.setProperty("--bar-h", Math.ceil(e.target.getBoundingClientRect().height) + "px")).observe(document.getElementById("bar")); } catch {}

// Draggable dividers between the nav and the review, and between the list and the detail. Widths are remembered per viewer.
function resizer(id, prop, min, max, edge) {
  const h = document.getElementById(id), root = document.documentElement;
  const set = (w) => { w = Math.round(Math.min(max, Math.max(min, w))); root.style.setProperty(prop, w + "px"); h.setAttribute("aria-valuenow", w); return w; };
  try { const saved = +localStorage.getItem(prop); if (saved) set(saved); } catch {}
  const save = (w) => { try { localStorage.setItem(prop, w); } catch {} };
  h.addEventListener("pointerdown", (e) => {
    e.preventDefault(); h.setPointerCapture(e.pointerId); h.classList.add("is-dragging"); document.body.classList.add("is-resizing");
    const move = (ev) => set(ev.clientX - edge());
    const up = () => { h.classList.remove("is-dragging"); document.body.classList.remove("is-resizing"); save(parseInt(getComputedStyle(root).getPropertyValue(prop))); h.removeEventListener("pointermove", move); h.removeEventListener("pointerup", up); };
    h.addEventListener("pointermove", move); h.addEventListener("pointerup", up);
  });
  h.addEventListener("dblclick", () => { root.style.removeProperty(prop); try { localStorage.removeItem(prop); } catch {} });
  h.addEventListener("keydown", (e) => {
    if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    e.preventDefault(); save(set(parseInt(getComputedStyle(root).getPropertyValue(prop)) + (e.key === "ArrowLeft" ? -16 : 16)));
  });
  h.setAttribute("aria-valuemin", min); h.setAttribute("aria-valuemax", max);
}
resizer("drag-nav", "--nav-width", 180, 420, () => 0);
resizer("drag-list", "--list-width", 220, 560, () => document.querySelector(".tree-col").getBoundingClientRect().left);

// Select any text in the detail and add it to the comment, quoted, as a starting point.
const quoteBtn = el("button", { type: "button", class: "quote-btn", hidden: "" }, [icon("message-square-plus"), el("span", { text: "Add to comment" })]);
document.body.append(quoteBtn);
let quoteText = "";
function placeQuote() {
  const sel = window.getSelection();
  const text = sel && !sel.isCollapsed ? sel.toString().trim() : "";
  const box = document.getElementById("list");
  const ta = box.querySelector("textarea:not([disabled])");
  if (!text || !ta || !box.contains(sel.anchorNode) || ta.contains(sel.anchorNode)) { quoteBtn.hidden = true; return; }
  quoteText = text;
  const rect = sel.getRangeAt(0).getBoundingClientRect();
  quoteBtn.hidden = false;
  quoteBtn.style.left = Math.max(8, Math.min(window.innerWidth - quoteBtn.offsetWidth - 8, rect.left + rect.width / 2 - quoteBtn.offsetWidth / 2)) + "px";
  quoteBtn.style.top = Math.max(8, rect.top - quoteBtn.offsetHeight - 8) + "px";
}
document.addEventListener("mouseup", () => setTimeout(placeQuote, 0));
document.addEventListener("keyup", (e) => { if (e.shiftKey) placeQuote(); });
document.addEventListener("scroll", () => { quoteBtn.hidden = true; }, true);
quoteBtn.addEventListener("mousedown", (e) => e.preventDefault());
quoteBtn.onclick = () => {
  const ta = document.getElementById("list").querySelector("textarea:not([disabled])");
  if (!ta || !quoteText) return;
  ta.value = (ta.value.trim() ? ta.value.replace(/\s+$/, "") + "\n" : "") + "“" + quoteText + "” ";
  ta.dispatchEvent(new Event("input"));
  ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
  window.getSelection().removeAllRanges(); quoteBtn.hidden = true;
};

render();

// Subscribe once to each collection. The page renders whatever is there, and redraws as Claude or a reviewer writes.
(async () => {
  try { db = await window.claude?.use?.("db"); } catch { db = null; }
  if (!db) { phase = "offline"; document.getElementById("offline").hidden = false; render(); return; }
  const fail = () => { phase = "offline"; document.getElementById("offline").hidden = false; render(); };
  const rows = (snap) => snap.docs.filter((d) => d.exists).map((d) => ({ ...(d.data() || {}), id: d.id }));
  db.collection("review").onSnapshot((snap) => { S.meta = rows(snap).find((d) => d.id === "meta") || {}; render(); }, fail);
  db.collection("rounds").onSnapshot((snap) => { S.rounds = new Map(rows(snap).map((d) => [d.id, d])); render(); }, fail);
  db.collection("rules").onSnapshot((snap) => { S.rules = new Map(rows(snap).map((d) => [d.id, d])); render(); }, fail);
  db.collection("items").onSnapshot((snap) => { S.items = new Map(rows(snap).map((d) => [d.id, d])); phase = "ready"; render(); }, fail);
  db.collection("decisions").onSnapshot((snap) => {
    const next = {};
    for (const d of rows(snap)) next[d.id] = { status: str(d.status), comment: str(d.comment) };
    // Keep what this viewer is typing; take everything else from the store.
    const typing = document.activeElement?.id?.startsWith("c-") ? document.activeElement.id.slice(2) : null;
    if (typing && S.decisions[typing]) next[typing] = { ...next[typing], comment: S.decisions[typing].comment };
    S.decisions = next;
    render();
  }, fail);
})();
</script>
